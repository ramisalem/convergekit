name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: convergekit
          POSTGRES_PASSWORD: convergekit_secret
          POSTGRES_DB: convergekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U convergekit -d convergekit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://convergekit:convergekit_secret@localhost:5432/convergekit
      DIRECT_URL: postgresql://convergekit:convergekit_secret@localhost:5432/convergekit
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: convergekit-ci-secret-for-tests
      BETTER_AUTH_URL: http://localhost:4000
      API_BASE_URL: http://localhost:4001
      WEB_APP_URL: http://localhost:4000
      ALLOWED_ORIGINS: http://localhost:4000
      ACCESS_ALLOWED_EMAIL_DOMAIN: ""
      ACCESS_ALLOWED_GITHUB_ORG: ""
      ACCESS_ALLOWED_REPOSITORY_HOST: github.com
      WORKFORCE_SSO_ENABLED: "false"
      WORKFORCE_SSO_PROVIDER_LABEL: Authentik
      WORKFORCE_SAML_SP_ENTITY_ID: urn:convergekit:ci
      CONVERGEKIT_SESSION_TTL_DAYS: "14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Verify public tree
        run: |
          bash scripts/opensource-sanitization.test.sh
          bash scripts/package-scope.test.sh
          bash scripts/local-env-parity.test.sh
          bash scripts/dev-sh-compose-wrapper.test.sh
          bash scripts/local-compose-config.test.sh

      - name: Test
        run: pnpm turbo test

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build
