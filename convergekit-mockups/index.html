<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ConvergeKit — Modernization</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    #root { height: 100%; }
    .artboard-host { width: 100%; height: 100%; background: #fff; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="repo-list.jsx"></script>
  <script type="text/babel" src="chat.jsx"></script>
  <script type="text/babel" src="settings-tab.jsx"></script>
  <script type="text/babel" src="repo-guide.jsx"></script>
  <script type="text/babel" src="repo-detail.jsx"></script>
  <script type="text/babel" src="wiki.jsx"></script>
  <script type="text/babel" src="settings-global.jsx"></script>
  <script type="text/babel" src="auth-screens.jsx"></script>
  <script type="text/babel" src="dialogs-and-states.jsx"></script>
  <script type="text/babel" src="settings-extras.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "compact"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const d = t.density;

      // Each artboard sized to fit its screen comfortably at full bleed.
      // Repo Guide gets the widest artboard since it shows side-by-side.
      return (
        <React.Fragment>
          <DesignCanvas defaultZoom={0.5}>
            <DCSection id="entry" title="Public &amp; auth" subtitle="Landing, sign-in, invite acceptance">
              <DCArtboard id="landing" label="Landing" width={1280} height={840}>
                <div className="artboard-host"><LandingScreen density={d} /></div>
              </DCArtboard>
              <DCArtboard id="signin-user" label="Sign-in · user" width={1280} height={760}>
                <div className="artboard-host"><SignInScreen density={d} mode="user" /></div>
              </DCArtboard>
              <DCArtboard id="signin-admin" label="Sign-in · admin" width={1280} height={760}>
                <div className="artboard-host"><SignInScreen density={d} mode="admin" /></div>
              </DCArtboard>
              <DCArtboard id="accept-invite" label="Accept invite" width={1280} height={760}>
                <div className="artboard-host"><AcceptInviteScreen density={d} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection id="anchor" title="Repository detail · Repo Guide" subtitle="Anchor screen — current vs proposed, side by side">
              <DCArtboard id="guide" label="Repo detail · Repo Guide" width={1440} height={920}>
                <div className="artboard-host">
                  <RepoDetailScreen density={d} initialTab="guide" screenLabel="A · Repo Guide" />
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection id="prototype" title="Workspace flow" subtitle="Repository list → detail · Chat → detail · Settings">
              <DCArtboard id="list" label="Repository list" width={1280} height={840}>
                <div className="artboard-host">
                  <RepoListScreen density={d} />
                </div>
              </DCArtboard>
              <DCArtboard id="list-empty" label="Repository list · empty (admin)" width={1280} height={760}>
                <div className="artboard-host"><EmptyAdminScreen density={d} /></div>
              </DCArtboard>
              <DCArtboard id="add-repo" label="Add repository dialog" width={1280} height={840}>
                <div className="artboard-host"><AddRepoDialog density={d} /></div>
              </DCArtboard>
              <DCArtboard id="docs-progress" label="Docs · job progress" width={1280} height={840}>
                <div className="artboard-host"><DocsProgressScreen density={d} /></div>
              </DCArtboard>
              <DCArtboard id="chat-empty" label="Chat · empty" width={1408} height={840}>
                <div className="artboard-host"><ChatEmptyScreen density={d} /></div>
              </DCArtboard>
              <DCArtboard id="chat" label="Repo detail · Chat" width={1408} height={840}>
                <div className="artboard-host">
                  <RepoDetailScreen density={d} initialTab="chat" screenLabel="B · Chat" />
                </div>
              </DCArtboard>
              <DCArtboard id="settings-repo" label="Repo detail · Advanced Settings" width={1280} height={920}>
                <div className="artboard-host">
                  <RepoDetailScreen density={d} initialTab="settings" screenLabel="C · Repo settings" />
                </div>
              </DCArtboard>
              <DCArtboard id="docs" label="Repo detail · Documentation (admin)" width={1280} height={840}>
                <div className="artboard-host">
                  <RepoDetailScreen density={d} initialTab="docs" screenLabel="D · Docs (admin)" />
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection id="reading" title="Reading & administration" subtitle="Wiki article · Global settings">
              <DCArtboard id="wiki" label="Wiki article" width={1280} height={860}>
                <div className="artboard-host">
                  <WikiScreen density={d} />
                </div>
              </DCArtboard>
              <DCArtboard id="wiki-empty" label="Wiki · not generated" width={1280} height={760}>
                <div className="artboard-host"><WikiEmptyScreen density={d} /></div>
              </DCArtboard>
              <DCArtboard id="settings-global" label="Settings · Users" width={1280} height={920}>
                <div className="artboard-host">
                  <SettingsGlobalScreen density={d} />
                </div>
              </DCArtboard>
              <DCArtboard id="settings-ai" label="Settings · AI provider" width={1280} height={920}>
                <div className="artboard-host"><AIProviderScreen density={d} /></div>
              </DCArtboard>
              <DCArtboard id="settings-groups" label="Settings · Groups + drawer" width={1280} height={920}>
                <div className="artboard-host"><GroupsScreen density={d} /></div>
              </DCArtboard>
              <DCArtboard id="settings-policy" label="Settings · Access policy" width={1280} height={760}>
                <div className="artboard-host"><PolicyScreen density={d} /></div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Density" />
            <TweakRadio
              label="UI density"
              value={t.density}
              options={["compact", "comfortable", "roomy"]}
              onChange={(v) => setTweak("density", v)}
            />
            <div style={{ fontSize: 10.5, color: "rgba(41,38,27,.55)", lineHeight: 1.4 }}>
              Affects all artboards. Type-size, row padding, control height, tab padding,
              card padding, and gap all retune from one token.
            </div>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
